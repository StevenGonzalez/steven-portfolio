<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96">
  <!-- The postage stamp on the contact letter (globals.css .stamp): a sky island in full summer, painted like the world at
       the top of the page. The perforations are a CSS mask. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa6c6"/>
      <stop offset="0.5" stop-color="#b9d4d6"/>
      <stop offset="0.9" stop-color="#f3d9a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="55" cy="23" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.25" stop-color="#fff1c8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff1c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="20" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a88262"/>
      <stop offset="0.55" stop-color="#7d5d45"/>
      <stop offset="1" stop-color="#4e3a2e"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="41" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93bb63"/>
      <stop offset="1" stop-color="#4f7d3c"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="46" x2="0" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#f4fbff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pic"><rect x="7" y="7" width="66" height="66"/></clipPath>
    <clipPath id="under"><path d="M20 45L23.5 51.5L26.5 51L29.5 57.5L33 57L36 65.5L40 72L43.5 64L47 63L50 56L53.5 56.5L56.5 50L60 45Z"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 -1.6 1.15"/>
    </filter>
  </defs>
  <rect width="80" height="96" fill="#f7f1e3"/>
  <g clip-path="url(#pic)">
    <rect x="7" y="7" width="66" height="66" fill="url(#sky)"/>
    <rect x="7" y="7" width="66" height="66" fill="url(#glow)"/>
    <circle cx="55" cy="23" r="4.6" fill="#fff8e2"/>
    <!-- a far cloud bank, and two stray pieces of rock hazed by distance -->
    <g fill="#f6efe2" opacity="0.55"><circle cx="9" cy="58" r="5"/><circle cx="16" cy="56" r="4"/><circle cx="64" cy="57" r="4.5"/><circle cx="71" cy="55" r="5"/></g>
    <g opacity="0.7">
      <path d="M12 52.6q4-.9 8 0l-1.4 2.4q-1.4 2.6-2.6 3.6q-1.2-1-2.6-3.6Z" fill="#9a8a7a"/>
      <path d="M12 52.6q4-1 8 0q-4 .9-8 0Z" fill="#8fae78"/>
      <path d="M64.4 39.4q2.6-.6 5.2 0l-1 1.6q-.8 1.6-1.6 2.2q-.8-.6-1.6-2.2Z" fill="#a39a92"/>
      <path d="M64.4 39.4q2.6-.7 5.2 0q-2.6.6-5.2 0Z" fill="#9db58a"/>
    </g>
    <path d="M10 22c1.6-2.4 4.6-2.6 6-.6c1.6-2.6 6-2.2 6.4 1c2 0 2.6 2.6.4 2.6H10.6c-1.8 0-2-2.6-.6-3Z" fill="#fffaf0" opacity="0.9"/>
    <path d="M11 25h11.8c1 0 1.4-.6 1.2-1.2" fill="none" stroke="#d9c6ae" stroke-width="0.6" opacity="0.7"/>
    <path d="M20 15.6l1 .8l1-.8M24.4 13.6l.9.7l.9-.7M23.4 18l.8.6l.8-.6" fill="none" stroke="#4d5b66" stroke-width="0.5" stroke-linecap="round"/>
    <!-- the island: the rock is lit from the left and falls into shadow on the right, under the lip -->
    <path d="M20 45L23.5 51.5L26.5 51L29.5 57.5L33 57L36 65.5L40 72L43.5 64L47 63L50 56L53.5 56.5L56.5 50L60 45Z" fill="url(#rock)"/>
    <g clip-path="url(#under)" fill="none" stroke="#3f2d22" stroke-linecap="round">
      <path d="M20 48.6q10 2.4 20 1.4t20-2.4M22 53.2q9 2 18 1.2t17-2M26 58.6q7 1.4 14 .8t11-1.6M31 63.6q5 1 9 .6t7-1" stroke-width="0.55" opacity="0.4"/>
      <path d="M21 46.4q8 1.6 16 1.4" stroke="#e2c49c" stroke-width="0.8" opacity="0.5"/>
    </g>
    <path d="M27.5 51.5q-.6 3 .4 6M44.6 63.4q.8 2.4-.2 4.8M51.4 56.6q.8 2.6-.4 5.4M35 61q-.4 2 .2 3.6" fill="none" stroke="#3a2a20" stroke-width="0.45" stroke-linecap="round"/>
    <path d="M20 44.6Q40 40.5 60 44.6Q59.5 46.4 57.5 46Q55 47.6 52.5 46.8Q49 48.4 45.5 47.4Q42 48.6 38.5 47.6Q35 48.4 31.5 47Q28 47.8 25.5 46.4Q22 46.8 20 44.6Z" fill="url(#grass)"/>
    <path d="M22 43.8Q40 40.6 58 43.8" fill="none" stroke="#c4dc8c" stroke-width="0.6" opacity="0.8"/>
    <!-- the waterfall off the far lip, and its mist -->
    <path d="M56.4 46.3q.5 9 1 20h1.9q-.5-11-.9-20Z" fill="url(#fall)"/>
    <path d="M57.4 46.6q.3 6 .5 13" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.8"/>
    <!-- the tree -->
    <path d="M34.2 44.4C34.4 41.4 33.4 39 34.8 36.2M34.3 40.2l-2.2-2M34.6 38.4l2-1.4" fill="none" stroke="#4a3426" stroke-width="1.1" stroke-linecap="round"/>
    <g>
      <g fill="#3e6a3a"><circle cx="30.6" cy="34.6" r="3.4"/><circle cx="34.8" cy="32.6" r="4.2"/><circle cx="38.8" cy="35" r="3.3"/><circle cx="33" cy="37" r="2.8"/><circle cx="36.8" cy="37" r="2.8"/></g>
      <g fill="#5e9147"><circle cx="31.4" cy="33.6" r="2.5"/><circle cx="35.4" cy="31.6" r="3.2"/><circle cx="38.8" cy="34" r="2.4"/></g>
      <g fill="#93c06a"><circle cx="36.6" cy="30.6" r="1.6"/><circle cx="39.6" cy="33" r="1.1"/><circle cx="32.6" cy="32.4" r="1.1"/></g>
    </g>
    <circle cx="27" cy="44.1" r="0.6" fill="#f2c94c"/><circle cx="45" cy="43.6" r="0.5" fill="#f6f0e0"/><circle cx="50" cy="44.2" r="0.6" fill="#e78fa0"/>
    <!-- the sea of cloud the island floats over -->
    <g fill="#ecd5b2"><rect x="7" y="68" width="66" height="6"/><circle cx="8" cy="67" r="4.2"/><circle cx="15" cy="65.4" r="5"/><circle cx="23" cy="67.4" r="4"/><circle cx="31" cy="66.6" r="4.6"/><circle cx="47" cy="66.4" r="4.4"/><circle cx="54" cy="64.8" r="5.2"/><circle cx="62" cy="66.8" r="4.2"/><circle cx="69" cy="65.6" r="4.8"/></g>
    <g fill="#fffaf0"><rect x="7" y="71.5" width="66" height="2"/><circle cx="6" cy="71" r="3.6"/><circle cx="12" cy="70" r="4.4"/><circle cx="19" cy="71.4" r="3.4"/><circle cx="25" cy="69.6" r="4.4"/><circle cx="32" cy="71" r="3.4"/><circle cx="39" cy="69.4" r="4.8"/><circle cx="46" cy="71.2" r="3.6"/><circle cx="52" cy="70" r="4.2"/><circle cx="59" cy="71.4" r="3.4"/><circle cx="65" cy="69.8" r="4.4"/><circle cx="72" cy="71" r="3.8"/></g>
    <g fill="#ffffff" opacity="0.45"><circle cx="57.6" cy="64.6" r="2"/><circle cx="59.8" cy="65.2" r="1.6"/></g>
  </g>
  <rect x="7" y="7" width="66" height="66" fill="none" stroke="#3d4a52" stroke-width="0.7" opacity="0.55"/>
  <text x="40" y="85.5" text-anchor="middle" font-family="Georgia, serif" font-size="7.6" letter-spacing="1.4" fill="#6a4a2a">SKY ISLANDS</text>
  <rect width="80" height="96" filter="url(#grain)" opacity="0.14"/>
</svg>
