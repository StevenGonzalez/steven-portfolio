<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200">
  <!-- A pressed snowdrop, tucked under a project card in winter (globals.css .work::before): its three white petals gone
       faintly translucent, and the green mark on the inner one. -->
  <defs>
    <linearGradient id="p" x1="0" y1="-46" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4e6d6"/>
      <stop offset="1" stop-color="#faf8f0"/>
    </linearGradient>
    <linearGradient id="l" x1="-52" y1="-30" x2="-30" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a6bd92"/>
      <stop offset="1" stop-color="#7f9c6c"/>
    </linearGradient>
    <filter id="pressed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" result="crinkle"/>
      <feDisplacementMap in="SourceGraphic" in2="crinkle" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="leaf"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.55  0 0 0 0 0.42  1.6 0 0 0 -0.62"/>
      <feComposite in2="leaf" operator="in"/>
      <feComposite in2="leaf" operator="over"/>
    </filter>
  </defs>
  <g filter="url(#pressed)" stroke-linecap="round">
    <path d="M-30 92C-30 20 -10 -50 30 -70Q44 -76 46 -60" fill="none" stroke="#7d9a6c" stroke-width="4.6"/>
    <path d="M-34 90C-60 40 -66 0 -52 -30C-46 6 -40 46 -30 88Z" fill="url(#l)" stroke="#748f62" stroke-width="1.4" opacity="0.9"/>
    <path d="M-34 86C-48 50 -54 10 -52 -24" fill="none" stroke="#c4d4b2" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="46" cy="-52" rx="6" ry="7" fill="#9bb586"/>
    <g fill="url(#p)" stroke="#cdc8b3" stroke-width="1.6" stroke-linejoin="round">
      <path d="M46 -46C40 -24 42 4 50 20C56 2 54 -24 46 -46Z"/>
      <path d="M46 -46C30 -30 28 4 40 24C50 4 54 -26 46 -46Z" opacity="0.88"/>
      <path d="M46 -46C62 -32 70 -2 60 18C48 0 42 -26 46 -46Z" opacity="0.88"/>
    </g>
    <g fill="none" stroke="#d8d3bf" stroke-width="0.9" opacity="0.8"><path d="M44 -40C36 -20 36 4 40 18M48 -40C60 -24 62 -2 58 12"/></g>
    <path d="M45 13q5 5 10 0" fill="none" stroke="#8fb07a" stroke-width="3"/>
  </g>
</svg>
