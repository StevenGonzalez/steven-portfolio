<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -108 200 200">
  <!-- A pressed maple leaf, faded, tucked under a project card in autumn (globals.css .work::before): the outline of the
       leaves the world's tree drops, flattened and dried, its colour gone patchy and its edge a little crinkled. -->
  <defs>
    <radialGradient id="fade" cx="0" cy="-10" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e39a5a"/>
      <stop offset="0.6" stop-color="#cf6a3e"/>
      <stop offset="1" stop-color="#a9472c"/>
    </radialGradient>
    <filter id="pressed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" result="crinkle"/>
      <feDisplacementMap in="SourceGraphic" in2="crinkle" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="leaf"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.2  0 0 0 0 0.1  1.6 0 0 0 -0.62"/>
      <feComposite in2="leaf" operator="in"/>
      <feComposite in2="leaf" operator="over"/>
    </filter>
    <clipPath id="blade"><path d="M0 -100L10 -80L24 -84L18 -50L52 -62L62 -78L66 -56L96 -50L70 -30L78 -16L44 -4L62 30L50 32L52 48L20 26L0 40L-20 26L-52 48L-50 32L-62 30L-44 -4L-78 -16L-70 -30L-96 -50L-66 -56L-62 -78L-52 -62L-18 -50L-24 -84L-10 -80Z"/></clipPath>
  </defs>
  <g filter="url(#pressed)">
    <path d="M2 30Q6 62 16 86" fill="none" stroke="#8e4a2e" stroke-width="6" stroke-linecap="round"/>
    <path fill="url(#fade)" stroke="#9a432a" stroke-width="2.4" stroke-linejoin="round" d="M0 -100L10 -80L24 -84L18 -50L52 -62L62 -78L66 -56L96 -50L70 -30L78 -16L44 -4L62 30L50 32L52 48L20 26L0 40L-20 26L-52 48L-50 32L-62 30L-44 -4L-78 -16L-70 -30L-96 -50L-66 -56L-62 -78L-52 -62L-18 -50L-24 -84L-10 -80Z"/>
    <g clip-path="url(#blade)" fill="none" stroke="#f0b07a" stroke-linecap="round" opacity="0.75">
      <path d="M0 36V-90M0 6L-74 -40M0 6L74 -40M0 20L-40 34M0 20L40 34" stroke-width="2.6"/>
      <path d="M0 -30L-16 -62M0 -30L16 -62M0 -60L-10 -78M0 -60L10 -78M-30 -12L-40 -46M30 -12L40 -46M-50 -25L-70 -20M50 -25L70 -20M-46 -28L-58 -58M46 -28L58 -58M-30 -12L-56 2M30 -12L56 2" stroke-width="1.3"/>
    </g>
  </g>
</svg>
