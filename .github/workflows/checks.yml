# Runs yarn validate (lint, formatting, types, and the content and theme checks) on every push to main and every pull
# request. Vercel builds each push itself, so this does not build. The world and sound checks stay local: they need
# Firefox and compare the working tree with a revision.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The version Vercel builds and serves the site with.
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate
