# Runs yarn validate (lint, formatting, types, and the content and theme checks) on every push to main and every pull
# request, and alongside it builds the site and runs yarn check:speed, which loads its pages in Lighthouse as a phone
# would and fails if they load slower or shift about more than set limits. Vercel builds each push itself; the builds
# here are only for the speed check and the Playwright tests. On a push that touches lib/world, check:world compares the
# world's pixels with the previous push: a change meant to alter the picture says so with a "World-change:" line in its
# commit message. The sound check stays local.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  # A new advisory arrives without anyone pushing, so the audit below also runs on a clock.
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The version Vercel builds and serves the site with.
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: yarn
      # yarn audit's exit code adds up the severities found: 8 is high and 16 is critical, so 8 or more fails the job.
      - run: yarn audit --groups dependencies || [ $? -lt 8 ]

  world:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Compare the world's pixels with the previous push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --quiet "$BEFORE" HEAD -- lib/world; then echo "lib/world did not change."; exit 0; fi
          if git log "$BEFORE..HEAD" --format=%B | grep -q '^World-change:'; then echo "Declared a picture change."; exit 0; fi
          yarn check:world --base "$BEFORE"

  speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # Uses the runner's own Google Chrome.
      - run: yarn check:speed
      - run: yarn test:site

  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # Firefox and WebKit are Playwright's own builds of them, since it cannot drive the ordinary browsers. The system
      # packages and the browsers are separate steps, each with its own limit, so a stalled download fails in minutes and
      # the failed step says which of the two stalled. Together they normally take a minute or two.
      - run: yarn playwright install-deps firefox webkit
        timeout-minutes: 5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn playwright install firefox webkit
        timeout-minutes: 5
      - run: yarn test:engines
